name: Docker Build and Push

on:
  push:
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main", "master" ]

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/telegram-depiler

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate frontend lockfile
        working-directory: frontend
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --no-audit --no-fund
          fi

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node20-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-npm-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Set release metadata
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            label="${GITHUB_REF_NAME#v}"
          else
            label="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "label=${label}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TELEGRAM_DEPILER_RELEASE_LABEL=${{ steps.release.outputs.label }}
            TELEGRAM_DEPILER_RELEASE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Build complete application package
        if: github.event_name != 'pull_request'
        env:
          TELEGRAM_DEPILER_RELEASE_LABEL: ${{ steps.release.outputs.label }}
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run build
          cd ..
          python scripts/build_app_package.py --label "${{ steps.release.outputs.label }}"

      - name: Publish application update assets
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}"; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          else
            if [ -f "RELEASE_NOTES_v${{ steps.release.outputs.label }}.md" ]; then
              gh release create "${GITHUB_REF_NAME}" release-assets/* --verify-tag --title "${GITHUB_REF_NAME}" --notes-file "RELEASE_NOTES_v${{ steps.release.outputs.label }}.md"
            else
              gh release create "${GITHUB_REF_NAME}" release-assets/* --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes
            fi
          fi
