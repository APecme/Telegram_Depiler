name: Publish bata Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/telegram-depiler

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set bata release metadata
        id: release
        shell: bash
        run: echo "label=bata.$(TZ=Asia/Shanghai date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:bata
          build-args: |
            TELEGRAM_DEPILER_RELEASE_LABEL=${{ steps.release.outputs.label }}
            TELEGRAM_DEPILER_RELEASE_COMMIT=${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build application package
        env:
          TELEGRAM_DEPILER_RELEASE_LABEL: ${{ steps.release.outputs.label }}
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run build
          cd ..
          python scripts/build_app_package.py --label "${{ steps.release.outputs.label }}"
      - name: Publish experience update
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.release.outputs.label }}" release-assets/* --target "${GITHUB_SHA}" --prerelease --title "体验版 ${{ steps.release.outputs.label }}" --notes "来自 main 分支的体验版应用包。"
